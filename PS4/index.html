<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENDOGAMES</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin-bottom: 15px;
            color: #00adb5;
            font-size: 32px;
            letter-spacing: 1px;
        }

        #search-input {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #393e46;
            border-radius: 25px;
            background-color: #222831;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        #search-input:focus {
            border-color: #00adb5;
            box-shadow: 0 0 10px rgba(0, 173, 181, 0.5);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background-color: #222831;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        .game-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #393e46;
        }

        .game-info {
            padding: 15px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #eeeeee;
            line-height: 1.4;
        }

        .game-details {
            font-size: 12px;
            color: #aaaaaa;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .title-id-badge {
            display: inline-block;
            background-color: #393e46;
            color: #00adb5;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 4px;
            font-family: monospace;
            font-size: 13px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .download-btn {
            width: 100%;
            display: inline-block;
            background-color: #00adb5;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 5px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
            text-transform: uppercase;
            text-align: center;
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            background-color: #007b80;
        }

        .copy-btn {
            width: 100%;
            background-color: #393e46;
            color: #eeeeee;
            border: none;
            border-radius: 6px;
            padding: 8px 5px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .copy-btn:hover {
            background-color: #4f5663;
        }

        #status-msg {
            text-align: center;
            font-size: 18px;
            margin-top: 50px;
            color: #00adb5;
        }
    </style>
</head>
<body>

    <header>
        <h1>BENDOGAMES</h1>
        <input type="text" id="search-input" placeholder="Search by game title or CUSA ID...">
    </header>

    <div id="status-msg">Loading games...</div>
    <div class="games-grid" id="games-container"></div>

    <script>
        let allGames = [];

        async function loadGames() {
            const statusDiv = document.getElementById('status-msg');
            try {
                const response = await fetch('GAMES.json?v=' + Date.now());
                
                if (!response.ok) {
                    throw new Error('Failed to load GAMES.json');
                }

                const jsonContent = await response.json();
                
                const data = jsonContent.DATA || jsonContent; 
                allGames = [];

                for (let key in data) {
                    if (Object.prototype.hasOwnProperty.call(data, key)) {
                        let item = data[key];
                        if (item && typeof item === 'object') {
                            allGames.push({
                                download_url: key,
                                name: item.name || 'Untitled',
                                title_id: item.title_id || '',
                                cover_url: item.cover_url || '',
                                region: item.region || '',
                                version: item.version || ''
                            });
                        }
                    }
                }

                if (allGames.length === 0) {
                    statusDiv.innerText = "No games found in the file.";
                    return;
                }

                statusDiv.style.display = 'none';
                displayGames(allGames);

            } catch (error) {
                console.error("Error:", error);
                statusDiv.style.color = '#ff4d4d';
                statusDiv.innerHTML = `<b>Error:</b> ${error.message}`;
            }
        }

        function displayGames(games) {
            const container = document.getElementById('games-container');
            container.innerHTML = '';

            if (games.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No matching games found.</p>';
                return;
            }

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';

                const img = document.createElement('img');
                if (game.cover_url) {
                    img.src = game.cover_url;
                }
                img.alt = game.name;
                img.onerror = function() {
                    this.style.display = 'none';
                };

                const infoDiv = document.createElement('div');
                infoDiv.className = 'game-info';

                let cleanFileName = game.name;
                if (game.title_id) cleanFileName += ` [${game.title_id}]`;
                if (game.region) cleanFileName += ` [${game.region}]`;
                if (game.version) cleanFileName += ` [v${game.version}]`;

                infoDiv.innerHTML = `
                    <div>
                        <div class="game-title">${game.name}</div>
                        <div class="game-details">
                            ${game.title_id ? `<div class="title-id-badge">${game.title_id}</div><br>` : ''}
                            ${game.region ? `Region: ${game.region} ` : ''}
                            ${game.version ? `| Version: ${game.version}` : ''}
                        </div>
                    </div>
                    <div class="btn-group">
                        <a href="${game.download_url}" class="download-btn" target="_blank">Download</a>
                        <button class="copy-btn" onclick="copyName('${cleanFileName.replace(/'/g, "\\'")}', this)">Copy Name</button>
                    </div>
                `;

                if (game.cover_url) {
                    card.appendChild(img);
                }
                card.appendChild(infoDiv);
                container.appendChild(card);
            });
        }

        function copyName(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "Copied!";
                btn.style.backgroundColor = "#00adb5";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "#393e46";
                }, 1500);
            });
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredGames = allGames.filter(game => 
                game.name.toLowerCase().includes(searchTerm) || 
                game.title_id.toLowerCase().includes(searchTerm)
            );
            displayGames(filteredGames);
        });

        loadGames();
    </script>
</body>
</html>
